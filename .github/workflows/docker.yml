name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older image check moot.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Builds deploy/docker/Dockerfile (slim) from this checkout, then checks
      # the image end to end: a seeded token, a held start and its promotion,
      # and a pause that survives a container restart.
      - name: Build the image and check it end to end
        run: deploy/docker/smoke.sh

      # compose.yaml as documented, hardening included: read-only root, no
      # capabilities, no-new-privileges, the named state volume, a restart.
      - name: Bring up compose.yaml and check its limits
        run: deploy/docker/compose-smoke.sh

      # TEMPORARY diagnosis for the PR: which layer stops bwrap in a container.
      - name: Diagnose bwrap (temporary)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true
          if unshare --user --map-root-user true 2>&1; then echo "host: unprivileged userns OK"; else echo "host: unprivileged userns refused"; fi
          docker version --format 'docker {{.Server.Version}}'; docker compose version
          docker build -q -f deploy/docker/Dockerfile --target slim -t stratusd:diag . >/dev/null
          for opts in "" "--security-opt seccomp=unconfined" "--security-opt apparmor=unconfined" "--security-opt seccomp=unconfined --security-opt apparmor=unconfined"; do
            printf '== docker run %s: ' "${opts:-(defaults)}"
            if out=$(docker run --rm $opts stratusd:diag bwrap --ro-bind / / --unshare-pid -- /bin/true 2>&1); then echo OK; else echo "FAIL: $out"; fi
          done
          docker rmi stratusd:diag >/dev/null
