name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older image check moot.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Builds deploy/docker/Dockerfile (slim) from this checkout, then checks
      # the image end to end: a seeded token, a held start and its promotion,
      # and a pause that survives a container restart.
      - name: Build the image and check it end to end
        run: deploy/docker/smoke.sh

      # compose.yaml as documented, hardening included: read-only root, no
      # capabilities, no-new-privileges, the named state volume, a restart.
      - name: Bring up compose.yaml and check its limits
        run: deploy/docker/compose-smoke.sh

      # TEMPORARY for the PR: the checks must fail when compose.yaml loses
      # read_only or its named volume.
      - name: Mutants (temporary)
        run: |
          cp deploy/docker/compose.yaml /tmp/compose.yaml.orig
          sed -i '/^    read_only: true$/d' deploy/docker/compose.yaml
          if out=$(deploy/docker/compose-smoke.sh 2>&1); then echo "MUTANT read_only SURVIVED"; exit 1; fi
          printf '%s\n' "$out" | grep -E '^compose-smoke: ' | tail -1
          cp /tmp/compose.yaml.orig deploy/docker/compose.yaml
          sed -i '/^    volumes:$/,/^      - stratus-home:\/home\/node\/.stratus$/d' deploy/docker/compose.yaml
          grep -n 'stratus-home' deploy/docker/compose.yaml || true
          if out=$(deploy/docker/compose-smoke.sh 2>&1); then echo "MUTANT volume SURVIVED"; exit 1; fi
          printf '%s\n' "$out" | grep -E '^compose-smoke: ' | tail -1
          cp /tmp/compose.yaml.orig deploy/docker/compose.yaml
