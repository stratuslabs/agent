name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work, from your side.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds, config, or other tools you've looked at.
  - type: dropdown
    id: where
    attributes:
      label: Could it be a plugin?
      description: The core is kept small, and providers, channels, tools, memory stores and executors can all be plugins. See [Extending](https://github.com/stratuslabs/agent/blob/main/docs/guides/extending.md).
      options:
        - Yes, it could be a plugin
        - No, it needs a change to the core
        - Not sure
    validations:
      required: true
